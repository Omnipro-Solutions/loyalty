<h2>Restablecer tu contraseña</h2>

<p>
  Recibimos una solicitud para restablecer la contraseña de tu cuenta en Loyalty
  Portal.
</p>

<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/restablecer-contrasena"

  >
</p>

<p>
  Si no fuiste tú, puedes ignorar este correo — tu contraseña actual sigue

</p>
